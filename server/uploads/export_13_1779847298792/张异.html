<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dear 张异 - 专属纪念页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #2e4a3a;
            min-height: 100vh;
        }
        .page { max-width: 800px; margin: 0 auto; padding: 40px 20px; }
        .hero {
            text-align: center;
            padding: 80px 0 60px;
        }
        .hero h1 {
            font-size: 3em;
            color: #43a047;
            margin-bottom: 10px;
        }
        .hero .intro { font-size: 1.2em; color: #388e3c; }
        .stories { margin: 40px 0; }
        .story {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 15px rgba(76,175,80,0.15);
        }
        .story h3 { color: #43a047; margin-bottom: 15px; }
        .story p { line-height: 1.8; }
        .message-section {
            background: linear-gradient(135deg, #43a047, #66bb6a);
            color: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin: 40px 0;
        }
        /* 留言区左对齐 */
		.message-section p {
			font-size: 1.15em;
			line-height: 2;
			text-align: left;        /* 左对齐 */
			white-space: pre-wrap;   /* 保留换行 */
			word-break: break-word;  /* 长单词换行 */
		}

		/* 签名区 */
		.signature-area {
			text-align: right;
			margin-top: 60px;
			padding: 30px 0;
			border-top: 1px solid #f0e0e5;
		}
		.signature-area .signature-name {
			font-size: 1.3em;
			font-weight: bold;
		}
		.signature-area .signature-date {
			font-size: 0.9em;
			opacity: 0.7;
			margin-top: 5px;
		}

		/* 底部版权 */
		.footer-line {
			text-align: center;
			padding: 40px 0 20px;
			font-size: 0.9em;
			opacity: 0.6;
		}
    </style>
</head>
<body>
    <div class="page">
        <section class="hero">
            <h1>张异</h1>
            
				<p class="intro">我最好的朋友</p>
			
        </section>
        
        
        <section class="stories">
            
                <div class="story">
                    <h3>🌟 从2020年1月1日开始的友情</h3>
                    <p>在2020年1月1日，我们的故事开始了。随着时间的流逝，我们的友情不断加深，回忆越来越丰富。每个时刻都是珍贵的，感谢你一直在我身边。</p>
                </div>
            
        </section>
        
        
        
        <section class="message-section">
            <h2>💬 想对你说</h2>
            <p>希望我们的友情能像这条进度条一样，随着时间的推移而不断增长，但愿每一个瞬间都能铭刻在心。</p>
        </section>
        
        
		<!-- 签名区 -->
		<section class="signature-area">
			
				<p class="signature-name">敬仰你的崔</p>
			
			<p class="signature-date">2026年5月27日</p>
		</section>

        <footer class="footer">
            <p class="footer-line">Made with <span class="heart">❤️</span> by Dear</p>
        </footer>
    </div>
</body>
</html>
