<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dear x - 专属纪念页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fff5f7 0%, #ffe0e6 100%);
            color: #4a4a4a;
            min-height: 100vh;
        }
        .page {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .hero {
            text-align: center;
            padding: 80px 0 60px;
        }
        .hero h1 {
            font-size: 3em;
            color: #ff6b8a;
            margin-bottom: 10px;
        }
        .hero .relation {
            font-size: 1.2em;
            color: #999;
            margin-bottom: 20px;
        }
        .hero .intro {
            font-size: 1.3em;
            color: #666;
            font-style: italic;
        }
        .stories {
            margin: 40px 0;
        }
        .story {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 20px rgba(255,107,138,0.1);
        }
        .story h3 {
            color: #ff6b8a;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        .story p {
            line-height: 1.8;
            font-size: 1.05em;
        }
        .message-section {
            background: linear-gradient(135deg, #ff6b8a, #ffa3b5);
            color: white;
            border-radius: 20px;
            padding: 40px;
            margin: 40px 0;
        }
        .message-section h2 {
            margin-bottom: 20px;
            text-align: center;
        }
        .message-section p {
			font-size: 1.15em;
			line-height: 2;
			text-align: left;        /* 左对齐 */
			white-space: pre-wrap;   /* 保留换行 */
			word-break: break-word;  /* 长单词换行 */
		}
        
        /* ============ 签名区 ============ */
        .signature-area {
            text-align: right;
            margin-top: 60px;
            padding: 30px 0;
            border-top: 1px solid #f0e0e5;
        }
        .signature-area .signature-name {
            font-size: 1.3em;
            color: #ff6b8a;
            font-weight: bold;
        }
        .signature-area .signature-date {
            font-size: 0.9em;
            color: #999;
            margin-top: 5px;
        }
        
        .footer-line {
            text-align: center;
            padding: 40px 0 20px;
            color: #bbb;
            font-size: 0.9em;
        }
        .footer-line .heart {
            color: #ff6b8a;
        }
    </style>
</head>
<body>
    <div class="page">
        <section class="hero">
            <h1>x</h1>
            <p class="relation">致最敬爱的爷爷奶奶</p>
            
                <p class="intro">x</p>
            
        </section>
        
        
        <section class="stories">
            
                <div class="story">
                    <h3>x</h3>
                    <p>x</p>
                </div>
            
        </section>
        
        
        
        <section class="message-section">
            <h2>💌 想对你说</h2>
            <p>x</p>
        </section>
        
        
        <!-- 签名区 -->
        <section class="signature-area">
            
                <p class="signature-name">x</p>
            
            <p class="signature-date">2026年5月25日</p>
        </section>
        
        <p class="footer-line">Made with <span class="heart">❤️</span> by Dear</p>
    </div>
</body>
</html>
