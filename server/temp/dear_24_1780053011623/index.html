<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dear a - 专属纪念页</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 100%);
            color: #5d3a4a;
            min-height: 100vh;
        }
        .page {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .hero {
            text-align: center;
            padding: 80px 0 60px;
            position: relative;
        }
        .hero::before {
            content: '💕';
            font-size: 4em;
            display: block;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .hero h1 {
            font-size: 3em;
            background: linear-gradient(135deg, #e91e63, #f06292);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .hero .intro {
            font-size: 1.2em;
            color: #ad1457;
        }
        .stories { margin: 40px 0; }
        .story {
            background: rgba(255,255,255,0.8);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            border-left: 4px solid #e91e63;
        }
        .story h3 { color: #e91e63; margin-bottom: 15px; }
        .story p { line-height: 1.8; }
        .message-section {
            background: linear-gradient(135deg, #e91e63, #f06292);
            color: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            margin: 40px 0;
        }
        /* 留言区左对齐 */
		.message-section p {
			font-size: 1.15em;
			line-height: 2;
			text-align: left;        /* 左对齐 */
			white-space: pre-wrap;   /* 保留换行 */
			word-break: break-word;  /* 长单词换行 */
		}

		/* 签名区 */
		.signature-area {
			text-align: right;
			margin-top: 60px;
			padding: 30px 0;
			border-top: 1px solid #f0e0e5;
		}
		.signature-area .signature-name {
			font-size: 1.3em;
			font-weight: bold;
		}
		.signature-area .signature-date {
			font-size: 0.9em;
			opacity: 0.7;
			margin-top: 5px;
		}

		/* 底部版权 */
		.footer-line {
			text-align: center;
			padding: 40px 0 20px;
			font-size: 0.9em;
			opacity: 0.6;
		}
    </style>
</head>
<body>
    <div class="page">
        <section class="hero">
            <h1>a</h1>
            
				<p class="intro">我最爱的人</p>
			
        </section>
        
        
        <section class="stories">
            
                <div class="story">
                    <h3>💕 a</h3>
                    <p>a</p>
                </div>
            
        </section>
        
        
        
        <section class="message-section">
            <h2>💌 想对你说</h2>
            <p>a</p>
        </section>
        
        
		<!-- 签名区 -->
		<section class="signature-area">
			
				<p class="signature-name">a</p>
			
			<p class="signature-date">2026年5月29日</p>
		</section>

        <footer class="footer">
            <p class="footer-line">Made with <span class="heart">❤️</span> by Dear</p>
        </footer>
    </div>
</body>
</html>
